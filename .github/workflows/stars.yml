name: Update star count

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count stars across owned repos (forks included)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars=$(gh api --paginate "users/${{ github.repository_owner }}/repos?per_page=100&type=owner" \
            --jq '.[].stargazers_count' | awk '{s+=$1} END {print s+0}')
          echo "stars=$stars"
          printf '{"schemaVersion":1,"label":"total stars","message":"%s","color":"DAA520"}\n' "$stars" > stars.json
      - name: Commit if changed
        run: |
          git diff --quiet -- stars.json 2>/dev/null && git ls-files --error-unmatch stars.json >/dev/null 2>&1 && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.json
          git commit -m "Update star count"
          git push
